name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release name (strip leading v)
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG section for tag
        id: changelog
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            {
              hdr = "## [" ver "]"
              if (!found && index($0, hdr) == 1) { found = 1 }
              if (found) {
                if (seen && $0 ~ /^## \[/) { exit }
                print
                seen = 1
              }
            }
          ' CHANGELOG.md > release_notes.md

          if [ -s release_notes.md ] && grep -q '[^[:space:]]' release_notes.md; then
            echo "has_body=true" >> "$GITHUB_OUTPUT"
          else
            : > release_notes.md
            echo "has_body=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (from CHANGELOG)
        if: steps.changelog.outputs.has_body == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: false

      - name: Create GitHub Release (auto-generated notes)
        if: steps.changelog.outputs.has_body != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
